services:
  gocrawl:
    image: ghcr.io/ba0f3/gocrawl:latest
    ports:
      - "8151:8151"    
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8151}
      HOST: ${HOST:-0.0.0.0}
      DB_NAME: ${DB_NAME:-gocrawl}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      MAX_CONCURRENT_CRAWLS: ${MAX_CONCURRENT_CRAWLS:-10}
      CRAWL_TIMEOUT: ${CRAWL_TIMEOUT:-30s}
      USER_AGENT: ${USER_AGENT:-GoCrawl/1.0}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-24h}
      # Rate limiting is opt-in: set both to positive values (e.g. 100 and 1h) to enable.
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-0}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-0}
      LIGHTPANDA_HTTP_URL: ${LIGHTPANDA_HTTP_URL:-http://lightpanda:9222}
    restart: unless-stopped

  lightpanda:
    image: lightpanda/browser:nightly
    ports:
      - "9222:9222"
    restart: unless-stopped
