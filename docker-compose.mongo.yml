# Optional overlay: MongoDB for ENABLE_AUTH=true (or any mongo-backed setup).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mongo.yml up -d
# Set in .env (see README): DATABASE_DRIVER=mongo, MONGO_URI=mongodb://mongo:27017, ENABLE_AUTH=true, JWT_SECRET=...

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  gocrawl:
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
